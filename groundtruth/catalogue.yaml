    hostname: "log4j.{base_domain}"
    ports: [8080]
    scheme: http
    app: "log4shell target (vulnerable-app pinned to log4j 2.14.1)"
    tier: 1
    discovery: seed
    expected_templates: ["log4j-rce"]
    custom_template: true
    certificate_issues: []
    planted_secrets: []

