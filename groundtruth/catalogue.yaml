# AIS-Y test-range authoritative ground-truth catalogue.
#
# One entry per scenario. This is the known-answer set: every hostname, port,
# certificate defect, planted (fake) secret, and the nuclei template id(s) the
# scanner MUST trip. groundtruth/generate.py resolves the {eip}/{base_domain}
# placeholders from Terraform outputs and emits manifest.json.
#
# template ids below are the range's real custom-template ids. Tier-2 entries
# whose id is not in that custom list carry `custom_template: false` so the
# recall report can weight them separately.
#
# discovery: how the asset is meant to enter the attack surface.
#   ct-log      - published via a certificate, found through CT logs
#   brute-force - only reachable by subdomain/vhost brute force
#   seed        - handed to the scanner as an explicit seed root
#   none        - raw service, not a web asset (legacy host)

meta:
  range: aisy-test-range
  # base_domain and the per-host EIPs are filled from Terraform outputs by
  # generate.py; catalogue keeps the logical hostnames only.
  base_domain: "{base_domain}"
  contact: security@aisy.ai

scenarios:
  # ---------------------------------------------------------------------------
