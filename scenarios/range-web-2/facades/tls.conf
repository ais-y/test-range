# Shared TLS server block for the fingerprint facades. Each facade terminates
# TLS on 443 with the valid multi-SAN range cert and serves its static html.
# The SNI router (../sni-router.conf) ssl_preread-proxies 443 traffic here.
server {
    listen 443 ssl;
    ssl_certificate     /certs/facade.crt;
    ssl_certificate_key /certs/facade.key;
    root /usr/share/nginx/html;
    index index.html;
}
