# 403-bypass facade: /admin returns 403, but common bypass tricks slip through.
# The "protected" content is a static string; there is nothing sensitive behind it.
server {
    listen 80;
    server_name admin-403;

    location = /admin { return 403; }

    # Bypassable via trailing dot, //, or X-Original-URL - the detector's target.
    location = /admin/ { return 200 "range bypassed admin\n"; }
    location = /admin.. { return 200 "range bypassed admin\n"; }

    location / { return 200 "range 403-bypass host\n"; }
}
