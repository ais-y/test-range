# iis-detect facade: nginx wearing IIS server headers/shape. No real IIS.
server {
    listen 80;
    server_name iis;
    server_tokens off;
    add_header Server "Microsoft-IIS/10.0" always;
    add_header X-Powered-By "ASP.NET" always;
    add_header X-AspNet-Version "4.0.30319" always;
    location / { return 200 "range IIS shape\n"; }
}
