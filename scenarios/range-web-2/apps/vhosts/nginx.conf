# vhost-detect facade: a "staging" name-based vhost only reachable via the
# right Host header. The default server hides it; brute-forcing Host reveals it.
server {
    listen 80 default_server;
    server_name _;
    location / { return 404; }
}
server {
    listen 80;
    server_name staging;
    location / { return 200 "range hidden staging vhost\n"; }
}
