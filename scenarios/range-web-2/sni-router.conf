# SNI router for range-web-2 port 443.
#
# All nine TLS scenarios (4 fingerprint facades + 5 cert-defect hosts) share the
# host's single 443. This stream server reads the TLS SNI without terminating
# (ssl_preread) and passes the raw TLS connection through to the right backend,
# so each cert-defect backend's intentionally-broken cert reaches the scanner
# unchanged. Backends are matched on the leftmost SNI label, so the range's base
# domain does not need to be baked in here.
#
# Mounted as the router container's /etc/nginx/nginx.conf.
worker_processes auto;
events { worker_connections 1024; }

stream {
    map $ssl_preread_server_name $backend {
        ~^sfdc\.         salesforce-aura:443;
        ~^aem\.          aem:443;
        ~^telerik\.      telerik:443;
        ~^moveit\.       moveit:443;
        ~^expired\.      cert-expired:443;
        ~^self-signed\.  cert-self-signed:443;
        ~^mismatch\.     cert-mismatch:443;
        ~^oldtls\.       cert-oldtls:443;
        ~^expiring\.     cert-expiring:443;
        default          salesforce-aura:443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;
    }
}
